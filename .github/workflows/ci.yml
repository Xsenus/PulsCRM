name: CI

# Проверки на каждый Pull Request в main — до мержа, без деплоя.
# Запускается на GitHub-hosted runner: код из PR не должен выполняться на production-сервере
# (self-hosted runner с доступом к IIS используется только в deploy.yml).

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  FRONTEND_PATH: frontend/puls-next-web

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore solution
        run: dotnet restore backend/PulsNextMailing.sln

      - name: Test backend
        run: dotnet test backend/PulsNextMailing.sln --configuration Release --no-restore

      - name: Self-test vulnerability gate
        shell: pwsh
        run: |
          # Отчет с уязвимостью High должен ронять проверку, Moderate/Low — только предупреждать.
          ./scripts/check-nuget-vulnerabilities.ps1 -JsonPath scripts/fixtures/nuget-vulnerable-high.json
          if ($LASTEXITCODE -ne 1) { throw "Gate must fail on High vulnerabilities, exit code: $LASTEXITCODE" }
          ./scripts/check-nuget-vulnerabilities.ps1 -JsonPath scripts/fixtures/nuget-vulnerable-moderate.json
          if ($LASTEXITCODE -ne 0) { throw "Gate must pass on Moderate/Low vulnerabilities, exit code: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Scan NuGet vulnerabilities
        shell: pwsh
        run: ./scripts/check-nuget-vulnerabilities.ps1 -SolutionPath backend/PulsNextMailing.sln -MinimumSeverity High

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Audit frontend dependencies
        # npm audit (moderate и выше) с временными исключениями из audit-allowlist.json — scripts/audit-check.mjs.
        run: npm run audit:check

      - name: Build frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    # Образ закреплен: Playwright ставит браузеры и системные зависимости только на поддерживаемые версии
    # Ubuntu (ubuntu-latest уже 26.04, которую Playwright 1.60 не поддерживает).
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    defaults:
      run:
        working-directory: ${{ env.FRONTEND_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_PATH }}/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      # Интерфейс в браузере с подмененным API (без сервера и баз): чат, роли, раскладка, уведомления.
      - name: Run end-to-end tests
        run: npm run test:e2e -- --trace off

      - name: Upload Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: ${{ env.FRONTEND_PATH }}/test-results
          retention-days: 7
