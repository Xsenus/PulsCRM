name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulscrm-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: 8.0.x
  NODE_VERSION: "20"
  API_PROJECT: backend/src/PulsNext.Api/PulsNext.Api.csproj
  WORKER_PROJECT: backend/src/PulsNext.Worker/PulsNext.Worker.csproj
  FRONTEND_PATH: frontend/puls-next-web

jobs:
  deploy:
    runs-on:
      - self-hosted
      - windows
      - x64
      - iis-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/puls-next-web/package-lock.json

      - name: Restore solution
        run: dotnet restore backend/PulsNextMailing.sln

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} -c Release --no-restore -o "${{ github.workspace }}\artifacts\api"

      - name: Publish worker
        run: dotnet publish ${{ env.WORKER_PROJECT }} -c Release --no-restore -o "${{ github.workspace }}\artifacts\worker"

      - name: Deploy artifacts
        shell: powershell
        env:
          API_SITE_PATH: ${{ vars.API_SITE_PATH }}
          WEB_SITE_PATH: ${{ vars.WEB_SITE_PATH }}
          WORKER_PATH: ${{ vars.WORKER_PATH }}
          API_CONFIG_PATH: ${{ vars.API_CONFIG_PATH }}
          WORKER_CONFIG_PATH: ${{ vars.WORKER_CONFIG_PATH }}
          WORKER_SERVICE_NAME: ${{ vars.WORKER_SERVICE_NAME }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          .\scripts\deploy-iis.ps1 `
            -ApiSourcePath "${{ github.workspace }}\artifacts\api" `
            -ApiTargetPath $env:API_SITE_PATH `
            -WebSourcePath "${{ github.workspace }}\frontend\puls-next-web\dist" `
            -WebTargetPath $env:WEB_SITE_PATH `
            -WorkerSourcePath "${{ github.workspace }}\artifacts\worker" `
            -WorkerTargetPath $env:WORKER_PATH `
            -ApiConfigSourcePath $env:API_CONFIG_PATH `
            -WorkerConfigSourcePath $env:WORKER_CONFIG_PATH `
            -WorkerServiceName $env:WORKER_SERVICE_NAME `
            -HealthcheckUrl $env:HEALTHCHECK_URL
