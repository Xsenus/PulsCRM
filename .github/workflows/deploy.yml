name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulscrm-production
  cancel-in-progress: false

env:
  API_PROJECT: backend/src/PulsNext.Api/PulsNext.Api.csproj
  FRONTEND_PATH: frontend/puls-next-web

jobs:
  deploy:
    runs-on:
      - self-hosted
      - windows
      - x64
      - iis-prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use installed toolchain
        shell: powershell
        run: |
          "C:\Program Files\dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          dotnet --info
          node --version
          npm --version

      - name: Restore solution
        run: dotnet restore backend/PulsNextMailing.sln

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_PATH }}
        env:
          VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Publish API
        run: dotnet publish ${{ env.API_PROJECT }} -c Release --no-restore -o "${{ github.workspace }}\artifacts\api"

      - name: Deploy artifacts
        shell: powershell
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
          API_SITE_PATH: ${{ vars.API_SITE_PATH }}
          WEB_SITE_PATH: ${{ vars.WEB_SITE_PATH }}
          API_CONFIG_PATH: ${{ vars.API_CONFIG_PATH }}
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
        run: |
          $frontendUrl = if ([string]::IsNullOrWhiteSpace($env:FRONTEND_URL)) { "http://localhost:8080/" } else { $env:FRONTEND_URL }
          $authUsersUrl = if ([string]::IsNullOrWhiteSpace($env:PRODUCTION_API_URL)) { "" } else { "$($env:PRODUCTION_API_URL.TrimEnd('/'))/api/auth/users?take=1" }

          .\scripts\deploy-iis.ps1 `
            -ApiSourcePath "${{ github.workspace }}\artifacts\api" `
            -ApiTargetPath $env:API_SITE_PATH `
            -WebSourcePath "${{ github.workspace }}\frontend\puls-next-web\dist" `
            -WebTargetPath $env:WEB_SITE_PATH `
            -ApiConfigSourcePath $env:API_CONFIG_PATH `
            -HealthcheckUrl $env:HEALTHCHECK_URL `
            -WarmupUrls @($env:HEALTHCHECK_URL, $frontendUrl) `
            -ApiAppPoolName "PulsCRM.Api"

          .\scripts\smoke-iis.ps1 `
            -HealthcheckUrl $env:HEALTHCHECK_URL `
            -FrontendUrl $frontendUrl `
            -AuthUsersUrl $authUsersUrl `
            -ApiConfigPath $env:API_CONFIG_PATH `
            -ProductionApiUrl $env:PRODUCTION_API_URL
